<style>

    .section-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        margin-bottom:28px;
        flex-wrap:wrap;
    }

    .section-header h1{
        font-size:42px;
        color:#0f172a;
        letter-spacing:-1px;
    }

    .section-header p{
        color:#64748b;
        margin-top:8px;
        line-height:1.6;
    }

    .section-btn{
        display:inline-flex;
        align-items:center;
        gap:10px;
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        color:white;
        text-decoration:none;
        padding:16px 24px;
        border-radius:18px;
        font-weight:900;
        transition:.25s;
        box-shadow:0 18px 30px rgba(37,99,235,.25);
    }

    .section-btn:hover{
        transform:translateY(-2px);
    }

</style>

<div class="section-header">

    <div>

        <h1>
            {{ title }}
        </h1>

        <p>
            {{ subtitle }}
        </p>

    </div>

    {% if button_text and button_url %}

    <a href="{{ button_url }}" class="section-btn">
        {{ button_text }}
    </a>

    {% endif %}

</div>
