<style>

    .top-navbar{
        width:100%;
        height:86px;
        background:white;
        border-radius:28px;
        border:1px solid #e2e8f0;
        box-shadow:0 20px 45px rgba(15,23,42,.08);
        padding:0 28px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        margin-bottom:30px;
    }

    .navbar-left{
        display:flex;
        align-items:center;
        gap:18px;
        flex:1;
    }

    .navbar-search{
        position:relative;
        width:100%;
        max-width:520px;
    }

    .navbar-search input{
        width:100%;
        padding:16px 18px 16px 54px;
        border-radius:18px;
        border:1px solid #dbe3ec;
        background:#f8fafc;
        outline:none;
        font-size:14px;
        transition:.25s;
    }

    .navbar-search input:focus{
        border-color:#2563eb;
        background:white;
        box-shadow:0 0 0 4px rgba(37,99,235,.10);
    }

    .search-icon{
        position:absolute;
        left:18px;
        top:50%;
        transform:translateY(-50%);
        color:#64748b;
        font-size:18px;
    }

    .navbar-right{
        display:flex;
        align-items:center;
        gap:16px;
    }

    .nav-action{
        width:52px;
        height:52px;
        border-radius:18px;
        background:#f8fafc;
        border:1px solid #e2e8f0;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        transition:.25s;
        position:relative;
        text-decoration:none;
        color:#0f172a;
        font-size:20px;
    }

    .nav-action:hover{
        transform:translateY(-2px);
        background:white;
        box-shadow:0 15px 25px rgba(15,23,42,.08);
    }

    .notification-badge{
        position:absolute;
        top:-4px;
        right:-4px;
        width:22px;
        height:22px;
        border-radius:50%;
        background:#dc2626;
        color:white;
        font-size:11px;
        font-weight:900;
        display:flex;
        align-items:center;
        justify-content:center;
        border:2px solid white;
    }

    .user-box{
        display:flex;
        align-items:center;
        gap:14px;
        padding:10px 16px;
        border-radius:22px;
        background:#f8fafc;
        border:1px solid #e2e8f0;
    }

    .user-avatar{
        width:52px;
        height:52px;
        border-radius:18px;
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:900;
        font-size:18px;
        box-shadow:0 15px 25px rgba(37,99,235,.20);
        flex-shrink:0;
    }

    .user-info strong{
        display:block;
        color:#0f172a;
        font-size:14px;
    }

    .user-info span{
        color:#64748b;
        font-size:12px;
        font-weight:700;
    }

    .mobile-menu{
        display:none;
        width:52px;
        height:52px;
        border:none;
        border-radius:18px;
        background:#f8fafc;
        border:1px solid #e2e8f0;
        cursor:pointer;
        font-size:22px;
        transition:.25s;
    }

    .mobile-menu:hover{
        transform:translateY(-2px);
    }

    @media(max-width:1100px){

        .mobile-menu{
            display:flex;
            align-items:center;
            justify-content:center;
        }

    }

    @media(max-width:800px){

        .top-navbar{
            height:auto;
            flex-direction:column;
            align-items:stretch;
            padding:20px;
        }

        .navbar-left,
        .navbar-right{
            width:100%;
        }

        .navbar-right{
            justify-content:space-between;
            flex-wrap:wrap;
        }

        .navbar-search{
            max-width:none;
        }

        .user-box{
            flex:1;
        }

    }

</style>

<nav class="top-navbar">

    <div class="navbar-left">

        <button class="mobile-menu">
            ☰
        </button>

        <form method="get"
              action="{% url 'cliente_list' %}"
              class="navbar-search">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                name="q"
                placeholder="Buscar clientes, ventas o seguimientos..."
            >

        </form>

    </div>

    <div class="navbar-right">

        <a href="{% url 'reporte_dashboard' %}"
           class="nav-action">

            📊

        </a>

        <a href="{% url 'seguimiento_list' %}"
           class="nav-action">

            🔔

            {% if pendientes_recordatorios > 0 %}

            <div class="notification-badge">
                {{ pendientes_recordatorios }}
            </div>

            {% endif %}

        </a>

        <div class="user-box">

            <div class="user-avatar">
                {{ request.user.username|slice:":1"|upper }}
            </div>

            <div class="user-info">

                <strong>
                    {{ request.user.username }}
                </strong>

                <span>
                    {{ request.user.get_rol_display }}
                </span>

            </div>

        </div>

    </div>

</nav>
