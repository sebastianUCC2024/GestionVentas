<style>

    .table-container{
        background:white;
        border-radius:30px;
        border:1px solid #e2e8f0;
        box-shadow:0 25px 55px rgba(15,23,42,.08);
        overflow:hidden;
    }

    .table-header{
        padding:24px 28px;
        border-bottom:1px solid #e2e8f0;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
    }

    .table-header h2{
        font-size:24px;
        color:#0f172a;
    }

    .table-header p{
        margin-top:6px;
        color:#64748b;
    }

    .table-tools{
        display:flex;
        gap:12px;
        flex-wrap:wrap;
    }

    .tool-btn{
        padding:12px 18px;
        border-radius:14px;
        text-decoration:none;
        font-size:13px;
        font-weight:900;
        transition:.25s;
        border:none;
        cursor:pointer;
    }

    .tool-btn.primary{
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        color:white;
    }

    .tool-btn.secondary{
        background:#e2e8f0;
        color:#0f172a;
    }

    .tool-btn:hover{
        transform:translateY(-2px);
    }

    .table-wrap{
        overflow-x:auto;
    }

    .crm-table{
        width:100%;
        border-collapse:collapse;
        min-width:1000px;
    }

    .crm-table thead{
        background:#f8fafc;
    }

    .crm-table th{
        padding:18px;
        text-align:left;
        font-size:12px;
        color:#64748b;
        text-transform:uppercase;
        letter-spacing:.5px;
        font-weight:900;
        border-bottom:1px solid #e2e8f0;
    }

    .crm-table td{
        padding:18px;
        border-bottom:1px solid #eef2f7;
        font-weight:700;
        color:#0f172a;
    }

    .crm-table tbody tr{
        transition:.2s;
    }

    .crm-table tbody tr:hover{
        background:#f8fafc;
    }

    .status{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        padding:8px 14px;
        border-radius:999px;
        font-size:12px;
        font-weight:900;
    }

    .status.success{
        background:#dcfce7;
        color:#166534;
    }

    .status.warning{
        background:#fef3c7;
        color:#92400e;
    }

    .status.danger{
        background:#fee2e2;
        color:#991b1b;
    }

    .status.info{
        background:#dbeafe;
        color:#1d4ed8;
    }

    .actions{
        display:flex;
        gap:8px;
        flex-wrap:wrap;
    }

    .action-btn{
        padding:9px 13px;
        border-radius:12px;
        text-decoration:none;
        font-size:12px;
        font-weight:900;
        transition:.25s;
    }

    .action-btn.view{
        background:#dbeafe;
        color:#1d4ed8;
    }

    .action-btn.edit{
        background:#fef3c7;
        color:#92400e;
    }

    .action-btn.delete{
        background:#fee2e2;
        color:#991b1b;
    }

    .action-btn:hover{
        transform:translateY(-2px);
    }

</style>

<div class="table-container">

    <div class="table-header">

        <div>

            <h2>
                {{ table_title }}
            </h2>

            <p>
                {{ table_description }}
            </p>

        </div>

        <div class="table-tools">

            {% if export_pdf_url %}

            <a href="{{ export_pdf_url }}"
               class="tool-btn secondary">
                Exportar PDF
            </a>

            {% endif %}

            {% if export_excel_url %}

            <a href="{{ export_excel_url }}"
               class="tool-btn secondary">
                Exportar Excel
            </a>

            {% endif %}

            {% if create_url %}

            <a href="{{ create_url }}"
               class="tool-btn primary">
                Nuevo registro
            </a>

            {% endif %}

        </div>

    </div>

    <div class="table-wrap">

        <table class="crm-table">

            {% block table_content %}
            {% endblock %}

        </table>

    </div>

</div>
