<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado | GestionVentas</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                radial-gradient(circle at top left,#dc2626 0%,transparent 35%),
                radial-gradient(circle at bottom right,#f59e0b 0%,transparent 35%),
                #0f172a;
            overflow:hidden;
            position:relative;
        }

        .bg-shape{
            position:absolute;
            border-radius:50%;
            filter:blur(70px);
            opacity:.25;
        }

        .shape1{
            width:320px;
            height:320px;
            background:#dc2626;
            top:-90px;
            left:-90px;
        }

        .shape2{
            width:300px;
            height:300px;
            background:#f59e0b;
            bottom:-90px;
            right:-90px;
        }

        .card{
            width:100%;
            max-width:560px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:36px;
            padding:48px;
            text-align:center;
            position:relative;
            z-index:10;
            box-shadow:0 25px 60px rgba(0,0,0,.30);
        }

        .icon{
            width:120px;
            height:120px;
            margin:0 auto 30px;
            border-radius:50%;
            background:linear-gradient(135deg,#dc2626,#991b1b);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:60px;
            font-weight:900;
            box-shadow:0 20px 35px rgba(220,38,38,.25);
        }

        h1{
            color:white;
            font-size:42px;
            font-weight:900;
            letter-spacing:-1px;
            margin-bottom:14px;
        }

        p{
            color:#cbd5e1;
            line-height:1.8;
            font-size:16px;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:white;
            text-decoration:none;
            padding:17px 28px;
            border-radius:18px;
            font-weight:900;
            transition:.25s;
            box-shadow:0 18px 30px rgba(37,99,235,.30);
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .footer{
            margin-top:24px;
            color:#94a3b8;
            font-size:13px;
            line-height:1.6;
        }

        @media(max-width:600px){

            .card{
                margin:20px;
                padding:34px;
            }

            h1{
                font-size:34px;
            }

        }

    </style>

</head>

<body>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>

<div class="card">

    <div class="icon">
        !
    </div>

    <h1>Acceso denegado</h1>

    <p>
        No tienes permisos suficientes para acceder a esta sección del sistema.
        Contacta al administrador si consideras que esto es un error.
    </p>

    <a href="{% url 'ventas_dashboard' %}" class="btn">
        Volver al dashboard
    </a>

    <div class="footer">
        Sistema CRM GestionVentas
    </div>

</div>

</body>
</html>
