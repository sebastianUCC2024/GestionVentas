<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | GestionVentas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:Arial, sans-serif;
            background:
                linear-gradient(rgba(15,23,42,.85), rgba(15,23,42,.9)),
                url('https://images.unsplash.com/photo-1556740749-887f6717d7e4?q=80&w=1400');
            background-size:cover;
            background-position:center;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .login-container{
            width:100%;
            max-width:460px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.14);
            border-radius:30px;
            padding:45px;
            box-shadow:0 25px 60px rgba(0,0,0,.35);
            color:white;
        }

        .logo{
            text-align:center;
            margin-bottom:35px;
        }

        .logo h1{
            font-size:38px;
            margin-bottom:10px;
        }

        .logo p{
            color:#cbd5e1;
        }

        .field{
            margin-bottom:22px;
        }

        .field label{
            display:block;
            margin-bottom:10px;
            font-weight:bold;
        }

        .field input{
            width:100%;
            padding:16px;
            border:none;
            border-radius:16px;
            outline:none;
            background:rgba(255,255,255,.12);
            color:white;
            font-size:15px;
        }

        .field input::placeholder{
            color:#cbd5e1;
        }

        .btn{
            width:100%;
            padding:16px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 18px 35px rgba(37,99,235,.35);
        }

        .links{
            margin-top:28px;
            text-align:center;
        }

        .links a{
            display:block;
            margin-top:14px;
            color:#93c5fd;
            text-decoration:none;
            font-weight:bold;
        }

        .error{
            background:#fee2e2;
            color:#991b1b;
            padding:14px;
            border-radius:14px;
            margin-bottom:20px;
            font-size:14px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>GestionVentas</h1>
        <p>CRM de clientes y ventas</p>
    </div>

    {% if form.errors %}
        <div class="error">
            Usuario o contraseña incorrectos.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="field">
            <label>Usuario</label>

            <input
                type="text"
                name="username"
                placeholder="Ingresa tu usuario"
                required
            >
        </div>

        <div class="field">
            <label>Contraseña</label>

            <input
                type="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
            >
        </div>

        <button type="submit" class="btn">
            Ingresar al sistema
        </button>

    </form>

    <div class="links">

        <a href="{% url 'cliente_register' %}">
            Crear cuenta de cliente
        </a>

        <a href="{% url 'vendedor_register' %}">
            Registrar vendedor
        </a>

    </div>

</div>

</body>
</html>
