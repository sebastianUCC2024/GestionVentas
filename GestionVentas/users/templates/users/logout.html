<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logout</title>

    <style>

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            font-family:Arial,sans-serif;
        }

        .card{
            background:white;
            padding:50px;
            border-radius:24px;
            text-align:center;
            max-width:450px;
            width:100%;
        }

        h1{
            color:#0f172a;
            margin-bottom:14px;
        }

        p{
            color:#64748b;
            margin-bottom:25px;
        }

        a{
            display:inline-block;
            padding:14px 24px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:14px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>Sesión cerrada</h1>

    <p>
        Has cerrado sesión correctamente.
    </p>

    <a href="{% url 'login' %}">
        Volver al login
    </a>

</div>

</body>
</html>
