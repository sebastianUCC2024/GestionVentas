<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | GestionVentas</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            background:
                linear-gradient(135deg,#0f172a,#2563eb);
            font-family:Arial,sans-serif;
        }

        .register-card{
            width:100%;
            max-width:550px;
            background:white;
            border-radius:28px;
            padding:45px;
            box-shadow:0 25px 60px rgba(0,0,0,.25);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h1{
            color:#0f172a;
            margin-bottom:8px;
        }

        .title p{
            color:#64748b;
        }

        .field{
            margin-bottom:20px;
        }

        .field label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#0f172a;
        }

        .field input,
        .field select{
            width:100%;
            padding:15px;
            border:1px solid #dbeafe;
            border-radius:14px;
            outline:none;
            font-size:15px;
        }

        .field input:focus{
            border-color:#2563eb;
        }

        .btn{
            width:100%;
            padding:16px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
        }

        .btn:hover{
            opacity:.95;
        }

        .footer{
            text-align:center;
            margin-top:24px;
        }

        .footer a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

        .errorlist{
            list-style:none;
            margin-top:6px;
            color:#dc2626;
            font-size:13px;
        }

    </style>
</head>

<body>

<div class="register-card">

    <div class="title">
        <h1>Crear cuenta</h1>
        <p>Completa los datos para registrarte</p>
    </div>

    <form method="post">

        {% csrf_token %}

        {% for field in form %}

            <div class="field">

                <label>{{ field.label }}</label>

                {{ field }}

                {{ field.errors }}

            </div>

        {% endfor %}

        <button type="submit" class="btn">
            Crear cuenta
        </button>

    </form>

    <div class="footer">

        <a href="{% url 'login' %}">
            Volver al login
        </a>

    </div>

</div>

</body>
</html>
