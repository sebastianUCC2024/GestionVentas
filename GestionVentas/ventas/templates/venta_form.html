{% extends 'base.html' %}

{% block content %}
<style>
    :root{
        --primary:#2563eb;
        --dark:#0f172a;
        --border:#e2e8f0;
        --shadow:0 20px 45px rgba(15,23,42,.08);
    }

    body{
        background:linear-gradient(135deg,#eef2ff,#f8fafc);
        font-family:Arial;
    }

    .container{
        padding:40px;
    }

    .form-card{
        max-width:1000px;
        margin:auto;
        background:white;
        border-radius:28px;
        overflow:hidden;
        box-shadow:var(--shadow);
    }

    .header{
        background:linear-gradient(135deg,#0f172a,#2563eb);
        color:white;
        padding:35px;
    }

    .header h1{
        margin:0;
        font-size:34px;
    }

    .body{
        padding:35px;
    }

    .grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:22px;
    }

    .field{
        display:flex;
        flex-direction:column;
    }

    .field label{
        margin-bottom:10px;
        font-weight:bold;
        color:#0f172a;
    }

    .field input,
    .field textarea,
    .field select{
        padding:15px;
        border-radius:14px;
        border:1px solid var(--border);
        outline:none;
        font-size:15px;
        transition:.3s;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus{
        border-color:var(--primary);
        box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    .actions{
        margin-top:35px;
        display:flex;
        justify-content:space-between;
    }

    .btn{
        padding:14px 22px;
        border-radius:14px;
        border:none;
        cursor:pointer;
        text-decoration:none;
        font-weight:bold;
    }

    .save{
        background:var(--primary);
        color:white;
    }

    .cancel{
        background:#e2e8f0;
        color:#0f172a;
    }

    @media(max-width:800px){
        .grid{
            grid-template-columns:1fr;
        }
    }
</style>

<div class="container">

    <div class="form-card">

        <div class="header">
            <h1>Formulario de Venta</h1>
            <p>Registra una nueva oportunidad comercial.</p>
        </div>

        <div class="body">

            <form method="post">

                {% csrf_token %}

                <div class="grid">

                    {% for field in form %}
                    <div class="field">

                        <label>
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <small style="color:red;">
                                {{ field.errors }}
                            </small>
                        {% endif %}

                    </div>
                    {% endfor %}

                </div>

                <div class="actions">

                    <a href="{% url 'venta_list' %}" class="btn cancel">
                        Cancelar
                    </a>

                    <button type="submit" class="btn save">
                        Guardar Venta
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
    const inputs = document.querySelectorAll("input, textarea, select");

    inputs.forEach(input=>{
        input.addEventListener("focus",()=>{
            input.style.transform="scale(1.02)";
        });

        input.addEventListener("blur",()=>{
            input.style.transform="scale(1)";
        });
    });
</script>

{% endblock %}
