{% extends 'base.html' %}

{% block content %}
<style>
    .form-card{max-width:1000px;margin:auto;background:white;border-radius:28px;box-shadow:0 20px 45px rgba(15,23,42,.1);overflow:hidden}
    .form-header{background:linear-gradient(135deg,#0f172a,#4338ca);color:white;padding:36px}
    .form-header h1{font-size:34px;margin-bottom:8px}
    .form-header p{color:#ddd6fe}
    .form-body{padding:36px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
    .form-grid p{display:flex;flex-direction:column;gap:8px}
    label{font-weight:bold;color:#0f172a}
    input,select,textarea{width:100%;padding:15px;border:1px solid #e2e8f0;border-radius:14px;outline:none;font-size:15px;background:#f8fafc}
    input:focus,select:focus,textarea:focus{background:white;border-color:#4338ca;box-shadow:0 0 0 4px rgba(67,56,202,.12)}
    input[type="checkbox"]{width:auto}
    .actions{display:flex;justify-content:space-between;margin-top:32px;gap:15px}
    .btn{border:none;padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:bold;cursor:pointer;font-size:15px}
    .save{background:#4338ca;color:white}
    .cancel{background:#e2e8f0;color:#0f172a}
    .errorlist{list-style:none;color:#dc2626;font-size:13px}
    @media(max-width:760px){.form-grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>

<div class="form-card">
    <div class="form-header">
        <h1>Formulario de Seguimiento</h1>
        <p>Registra contactos, notas y próximas acciones.</p>
    </div>

    <div class="form-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-grid">
                {% for field in form %}
                    <p>
                        <label>{{ field.label }}</label>
                        {{ field }}
                        {{ field.errors }}
                    </p>
                {% endfor %}
            </div>

            <div class="actions">
                <a href="{% url 'seguimiento_list' %}" class="btn cancel">Cancelar</a>
                <button type="submit" class="btn save">Guardar seguimiento</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
