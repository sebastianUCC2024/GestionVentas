{% extends 'base.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
    }

    .form-header {
        margin-bottom: 28px;
    }

    .form-header h1 {
        font-size: 38px;
        color: #0f172a;
    }

    .form-header p {
        color: #64748b;
        margin-top: 8px;
    }

    .form-card {
        background: white;
        border-radius: 28px;
        padding: 34px;
        box-shadow: 0 20px 45px rgba(15,23,42,.08);
    }

    .form-group {
        margin-bottom: 22px;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-weight: 900;
        color: #0f172a;
    }

    input, textarea, select {
        width: 100%;
        padding: 16px;
        border: 1px solid #dbe3ec;
        border-radius: 18px;
        background: #f8fafc;
        font-size: 15px;
        outline: none;
    }

    textarea {
        resize: none;
    }

    .actions {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 28px;
    }

    .btn {
        padding: 16px 24px;
        border-radius: 18px;
        border: none;
        text-decoration: none;
        font-weight: 900;
        cursor: pointer;
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-secondary {
        background: #e2e8f0;
        color: #0f172a;
    }
</style>

<div class="form-container">
    <div class="form-header">
        <h1>Realizar pedido</h1>
        <p>Solicita un producto o servicio al equipo comercial.</p>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Producto o servicio</label>
                {{ form.producto }}
            </div>

            <div class="form-group">
                <label>Descripción del pedido</label>
                {{ form.descripcion }}
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                {{ form.cantidad }}
            </div>

            <div class="actions">
                <a href="{% url 'pedido_list' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Enviar pedido</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
