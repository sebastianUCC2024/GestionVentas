{% extends 'base.html' %}

{% block content %}
<style>
    .delete-card{max-width:650px;margin:40px auto;background:white;border-radius:28px;box-shadow:0 20px 45px rgba(15,23,42,.12);overflow:hidden}
    .delete-header{background:linear-gradient(135deg,#7f1d1d,#dc2626);color:white;text-align:center;padding:36px}
    .delete-header h1{font-size:32px;margin-bottom:8px}
    .delete-body{padding:34px}
    .summary{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:24px}
    .summary strong{font-size:20px;color:#0f172a}
    .summary span{display:block;color:#64748b;margin-top:8px}
    .check{display:flex;gap:10px;font-weight:bold;margin-bottom:24px}
    .actions{display:flex;justify-content:space-between;gap:14px}
    .btn{border:none;padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:bold;cursor:pointer}
    .cancel{background:#e2e8f0;color:#0f172a}
    .delete{background:#dc2626;color:white}
    .delete:disabled{opacity:.5;cursor:not-allowed}
</style>

<div class="delete-card">
    <div class="delete-header">
        <h1>Eliminar venta</h1>
        <p>Esta acción no se puede deshacer.</p>
    </div>

    <div class="delete-body">
        <div class="summary">
            <strong>{{ venta.titulo }}</strong>
            <span>Cliente: {{ venta.cliente.nombre }}</span>
            <span>Monto: ${{ venta.monto }}</span>
            <span>Estado: {{ venta.get_estado_display }}</span>
        </div>

        <form method="post">
            {% csrf_token %}
            <label class="check">
                <input type="checkbox" id="confirmDelete">
                Confirmo que deseo eliminar esta venta.
            </label>

            <div class="actions">
                <a href="{% url 'venta_list' %}" class="btn cancel">Cancelar</a>
                <button type="submit" class="btn delete" id="deleteBtn" disabled>Eliminar definitivamente</button>
            </div>
        </form>
    </div>
</div>

<script>
    const check = document.getElementById("confirmDelete");
    const btn = document.getElementById("deleteBtn");
    check.addEventListener("change", () => btn.disabled = !check.checked);
</script>
{% endblock %}
